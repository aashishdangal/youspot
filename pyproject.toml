[project]
name = "ytspot"
version = "0.1.0"
description = "Import YouTube audio into Spotify's Local Files as tagged MP3s"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.1",
    "mutagen>=1.47",
    "typer>=0.12",
]

[project.scripts]
ytspot = "ytspot.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytspot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
